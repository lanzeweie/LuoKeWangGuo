[project]
name = "luoke-autocatcher"
version = "0.1.0"
description = "洛克王国自动宠物捕捉脚本"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]

dependencies = [
    "dxcam>=0.0.5",
    "ultralytics>=8.2.0",
    "opencv-python>=4.9.0",
    "pynput>=1.7.6",
    "pywin32>=306",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
